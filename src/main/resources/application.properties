spring.application.name=JWS-Individuella-LF
server.port=8081
spring.datasource.url=jdbc:h2:mem:blogpostdb
server.error.include-message=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/BlogManagementRealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/BlogManagementRealm/protocol/openid-connect/certs

jwt.auth.converter.resource-id.name=blog-client
jwt.auth.converter.principle-attribute=preferred_username

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always